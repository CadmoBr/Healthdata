name: HealthData Intelligence CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  POSTGRES_HOST: "127.0.0.1"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "healthdata_user"
  POSTGRES_PASSWORD: "healthdata_pass_local"
  POSTGRES_DB: "healthdata_dw"

jobs:
  quality-and-tests:
    name: Lint, Unit Tests & dbt Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: healthdata_user
          POSTGRES_PASSWORD: healthdata_pass_local
          POSTGRES_DB: healthdata_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout do repositório
        uses: actions/checkout@v4

      - name: 2. Configuração do Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Instalação das dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Verificação de sintaxe e estilo (Ruff)
        run: |
          ruff check src/ dags/ tests/ ml/
          python -m py_compile dags/healthdata_pipeline.py ml/src/demand_forecasting.py

      - name: 5. Inicialização dos Schemas do PostgreSQL
        run: |
          python -c "
          from pathlib import Path
          from sqlalchemy import text
          from src.utils.db import get_db_engine
          engine = get_db_engine()
          sql_file = Path('sql/schemas/01_init_dw_schemas.sql')
          if sql_file.exists():
              with engine.begin() as conn:
                  conn.execute(text(sql_file.read_text(encoding='utf-8')))
          "

      - name: 6. Execução dos testes unitários e de integração (Pytest)
        run: |
          pytest tests/ -v --tb=short

      - name: 7. Validação de configuração do dbt
        run: |
          dbt parse --project-dir dbt/healthdata_dw --profiles-dir dbt/healthdata_dw

      - name: 8. Verificação de arquivos essenciais de infraestrutura
        run: |
          test -f docker-compose.yml
          test -f Dockerfile
          test -f requirements.txt
          test -f .env.example