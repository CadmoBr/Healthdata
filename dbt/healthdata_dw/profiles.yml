healthdata_dw:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      user: "{{ env_var('POSTGRES_USER', 'healthdata_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'healthdata_pass_local') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'healthdata_dw') }}"
      schema: dw
      threads: 4
      keepalives_idle: 0
